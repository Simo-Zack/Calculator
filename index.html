<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Calcolatrice</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="nascosto">
        <div id="display">100</div>

        <table id="calcolatrice">
            <tr>
                <td onclick="cancella()" class="grigi">⌫</td>
                <td onclick="elimina()" class="grigi">AC</td>
                <td onclick="percentuale()" class="grigi">%</td>
                <td class="operatore">/</td>
            </tr>
            <tr>
                <td class="nero">7</td>
                <td class="nero">8</td>
                <td class="nero">9</td>
                <td class="operatore">*</td>
            </tr>
            <tr>
                <td class="nero">4</td>
                <td class="nero">5</td>
                <td class="nero">6</td>
                <td class="operatore">-</td>
            </tr>
            <tr>
                <td class="nero">1</td>
                <td class="nero">2</td>
                <td class="nero">3</td>
                <td class="operatore">+</td>
            </tr>
            <tr>
                <td onclick="cambioSegno()" id="segno">+/-</td>
                <td class="nero">0</td>
                <td class="nero">,</td>
                <td id="uguale">=</td>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>

</body>

</html>
